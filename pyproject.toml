[project]
name = "cuewise-be"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "gjyannDev", email = "m.ghianf@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.162.0",
    "httpx>=0.28",
    "langfuse>=5.1.0",
    "openai>=3.42.1",
    "pdfplumber>=0.11.10",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.1",
    "pyjwt>=2.15.1",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.6",
    "sse-starlette>=3.6.0",
    "trafilatura>=2.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "postgres: needs a real Postgres with pgvector (set TEST_POSTGRES_URL to a throwaway database); skipped otherwise",
]
